[package]
name = "tempora-windows-guard"
version = "0.1.0"
edition = "2021"
publish = false

# No dependencies: the prototype calls documented Win32 primitives directly.
# This is a destination preflight, NOT a replacement for handle-relative commits.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
