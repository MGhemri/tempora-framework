[package]
name = "tempora-desktop"
version = "0.1.0"
description = "TEMPORA native desktop workspace"
authors = ["TEMPORA contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "tempora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
