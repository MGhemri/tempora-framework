name: TEMPORA Desktop Electron Beta 2 — Windows Release

# Runs tests in PR, publishes ONLY after merge to main. The release is an
# explicitly non-stable prerelease, never an unreviewed unsigned "stable".
on:
  pull_request:
    paths:
      - ".github/workflows/desktop-electron-beta2-release.yml"
      - "apps/desktop/electron/**"
      - "apps/desktop/src/**"
      - "apps/desktop/index.html"
      - "apps/desktop/bridge/**"
      - "apps/desktop/vite.config.ts"
      - "docs/releases/desktop-v0.1.1-beta.2.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-electron-beta2-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-electron-beta2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Windows x64 Electron beta — scientific and installer qualification
    runs-on: windows-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/desktop/electron/package-lock.json
      - name: Build shared GUI and verify native command contracts
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:bridge
          npm run test:windows-engine
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --test electron/tests/host.test.cjs
          node --test electron/tests/review-integrity.test.cjs
      - name: Stage audited offline scientific engine TEMPORA 3.0.0
        run: npm run stage:windows-engine
      - name: Restore exact-pinned Electron packaging toolchain
        working-directory: apps/desktop/electron
        run: npm ci --no-audit --no-fund
      - name: Build Windows x64 Chromium installer (unsigned)
        working-directory: apps/desktop/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Verify bundled engine, branding and canonical valid/invalid cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unpacked = (Resolve-Path 'electron/release/win-unpacked').Path
          $root = Join-Path $unpacked 'resources'
          $expected = @(
            (Join-Path $root 'engine/node.exe'),
            (Join-Path $root 'engine/worker.cjs'),
            (Join-Path $root 'engine/node_modules/tempora-framework/package.json')
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "BETA_SCIENTIFIC_ENGINE_MISSING: $file" }
          }
          node electron/tests/packaged-engine-smoke.cjs $root
          if ($LASTEXITCODE -ne 0) { throw 'BETA_PACKAGED_ENGINE_VALIDATION_FAILED' }
          $icon = 'electron/build/icon.ico'
          if (-not (Test-Path $icon -PathType Leaf)) { throw 'TEMPORA_OFFICIAL_ICON_MISSING' }
          $lock = (Get-Content 'electron/package-lock.json' -Raw | ConvertFrom-Json -AsHashtable)
          if ($lock.lockfileVersion -ne 3) { throw 'BETA_ELECTRON_LOCK_INVALID' }
          git diff --exit-code -- electron/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'BETA_ELECTRON_LOCK_CHANGED' }
      - name: Write SHA-256 manifest and provenance of unsigned NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'electron/release'
          $exe = @(Get-ChildItem $out -Filter '*SETUP.exe' -File)
          if ($exe.Count -ne 1) { throw 'BETA_INSTALLER_MISSING_OR_AMBIGUOUS' }
          $hash = (Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe[0].Name)" | Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          @(
            "release_channel=beta",
            "desktop_version=0.1.1-beta.2",
            "git_sha=$env:GITHUB_SHA",
            "engine=tempora-framework@3.0.0",
            "electron=45.2.3",
            "electron_lock_sha256=$((Get-FileHash electron/package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant())",
            "logo_ico_sha256=$((Get-FileHash electron/build/icon.ico -Algorithm SHA256).Hash.ToLowerInvariant())",
            "installer_sha256=$hash",
            "signed=false"
          ) | Set-Content -Path (Join-Path $out 'RELEASE-PROVENANCE.txt') -Encoding utf8
          Write-Host "BETA INSTALLER SHA256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-Windows-x64-BETA-2-UNSIGNED
          path: |
            apps/desktop/electron/release/*SETUP.exe
            apps/desktop/electron/release/SHA256SUMS.txt
            apps/desktop/electron/release/RELEASE-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish tagged GitHub prerelease (never stable)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TEMPORA-Desktop-Windows-x64-BETA-2-UNSIGNED
          path: release
      - name: Refuse to alter existing published tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='desktop-v0.1.1-beta.2'
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists; refusing a mutable beta release"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          test -s release/SHA256SUMS.txt
          test -s release/RELEASE-PROVENANCE.txt
          test "$(find release -maxdepth 1 -name '*SETUP.exe' -type f | wc -l)" -eq 1
      - name: Publish immutable-tag-named prerelease with Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          gh release create desktop-v0.1.1-beta.2 \
            release/*SETUP.exe release/SHA256SUMS.txt release/RELEASE-PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'TEMPORA Desktop 0.1.1 — Beta 2 (Windows x64, Chromium)' \
            --notes-file docs/releases/desktop-v0.1.1-beta.2.md \
            --prerelease
