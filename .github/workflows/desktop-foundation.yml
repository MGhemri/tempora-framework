name: TEMPORA Desktop Foundation

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "docs/reference/DESKTOP_ARCHITECTURE.md"
      - "docs/reference/ENGINE_BRIDGE.md"
      - ".github/workflows/desktop-foundation.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "docs/reference/DESKTOP_ARCHITECTURE.md"
      - ".github/workflows/desktop-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Desktop TypeScript and Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:bridge
      - run: npm run test:windows-engine

  rust:
    name: Desktop Rust native tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-installer:
    name: Desktop Windows x64 standalone NSIS
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Desktop dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify bridge
        run: npm run test:bridge
      - name: Verify packager contracts
        run: npm run test:windows-engine
      - name: Stage pinned Node and scientific engine
        run: npm run stage:windows-engine
      - name: Build native NSIS installer (unsigned CI artifact only)
        # Staging has already been audited above; do not resolve dependencies again.
        run: npx --no-install tauri build --config src-tauri/tauri.windows.conf.json
      - name: Smoke-test installed NSIS package without system Node on PATH
        shell: pwsh
        run: |
          $binary = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $binary) { throw "NSIS installer missing" }
          ./scripts/verify-windows-install.ps1 -Installer $binary.FullName -InstallDirectory "$env:RUNNER_TEMP/tempora-desktop-install"
      - name: Write installer and runtime checksums for provenance
        shell: pwsh
        run: |
          $install = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          if (-not $install) { throw "No installer" }
          $manifest = Get-Content "src-tauri/resources/engine/runtime-manifest.json" -Raw | ConvertFrom-Json
          $rows = @(
            ("installer_sha256=" + (Get-FileHash $install.FullName -Algorithm SHA256).Hash.ToLowerInvariant()),
            ("node_sha256=" + $manifest.node_sha256),
            ("worker_sha256=" + $manifest.worker_sha256),
            ("lock_sha256=" + $manifest.lock_sha256),
            ("source_sha=" + "$env:GITHUB_SHA")
          )
          $rows | Set-Content "src-tauri/target/release/bundle/nsis/provenance-sha256.txt"
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/target/release/bundle/nsis/engine-inventory.json"
      - name: Check NSIS artifact and embedded engine
        shell: pwsh
        run: |
          $binary = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $binary) { throw "NSIS installer not created" }
          $node = "src-tauri/resources/engine/node.exe"
          $worker = "src-tauri/resources/engine/worker.cjs"
          if (-not (Test-Path $node) -or -not (Test-Path $worker)) { throw "Embedded runtime resources absent" }
          Get-FileHash $binary.FullName -Algorithm SHA256 | Format-List
          Get-FileHash $node -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-Windows-x64-UNSIGNED-NOT-A-RELEASE
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-Windows-x64-Provenance-SHA256
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/provenance-sha256.txt
            apps/desktop/src-tauri/target/release/bundle/nsis/engine-inventory.json
          if-no-files-found: error
          retention-days: 7
