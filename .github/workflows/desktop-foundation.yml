name: TEMPORA Studio Foundation
on:
  pull_request:
    paths: ['apps/desktop/**', 'docs/reference/DESKTOP_ARCHITECTURE.md', '.github/workflows/desktop-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/desktop/ui/app.js
      - run: node --test apps/desktop/tests/foundation.test.mjs
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Check native Rust host
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
