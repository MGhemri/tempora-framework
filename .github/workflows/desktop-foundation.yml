name: TEMPORA Desktop Foundation

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "docs/reference/DESKTOP_ARCHITECTURE.md"
      - "docs/reference/ENGINE_BRIDGE.md"
      - ".github/workflows/desktop-foundation.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "docs/reference/DESKTOP_ARCHITECTURE.md"
      - ".github/workflows/desktop-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One-shot, branch-restricted handoff of the exact audited Cargo.lock
  # from run 42295928577. Does not execute any project source code.
  import-reviewed-lockfile:
    name: Commit verified Cargo.lock candidate
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/desktop-cargo-lock-provenance' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Import exact SHA256-pinned candidate from completed workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test -f apps/desktop/src-tauri/Cargo.lock; then
            echo "Lockfile already present: no automated commit."
            exit 0
          fi
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MGhemri/tempora-framework/actions/artifacts/13541602602/zip" \
            --output "$RUNNER_TEMP/cargo-lock-artifact.zip"
          unzip -p "$RUNNER_TEMP/cargo-lock-artifact.zip" Cargo.lock > apps/desktop/src-tauri/Cargo.lock
          echo "14200f525820cd8b8303938af6ee77426fae64a4d78df8d0472f59b302e726f9  apps/desktop/src-tauri/Cargo.lock" | sha256sum --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git commit -m "build(desktop): commit audited Cargo.lock from GitHub runner"
          git push origin HEAD:refs/heads/chore/desktop-cargo-lock-provenance

  frontend:
    name: Desktop TypeScript and Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:bridge
      - run: npm run test:windows-engine

  rust:
    name: Desktop Rust native tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # Generate the authentic Cargo resolution on a real Rust runner.
      # Until Cargo.lock is committed, this is a provenance artifact and NOT
      # a guarantee of reproducibility across different workflow runs.
      - name: Generate Cargo lockfile and print digest
        shell: bash
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          sha256sum src-tauri/Cargo.lock
      - name: Upload candidate Cargo.lock for review and commit
        uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-Cargo-Lock-Candidate-NOT-VERSIONED
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 30
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-installer:
    name: Desktop Windows x64 standalone NSIS
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Desktop dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify bridge
        run: npm run test:bridge
      - name: Verify packager contracts
        run: npm run test:windows-engine
      - name: Stage pinned Node and scientific engine
        run: npm run stage:windows-engine
      - name: Build native NSIS installer (unsigned CI artifact only)
        run: npm run build:windows
      - name: Smoke-test installed NSIS package without system Node on PATH
        shell: pwsh
        run: |
          $binary = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $binary) { throw "NSIS installer missing" }
          ./scripts/verify-windows-install.ps1 -Installer $binary.FullName -InstallDirectory "$env:RUNNER_TEMP/tempora-desktop-install"
      - name: Write installer and runtime checksums for provenance
        shell: pwsh
        run: |
          $install = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          if (-not $install) { throw "No installer" }
          $manifest = Get-Content "src-tauri/resources/engine/runtime-manifest.json" -Raw | ConvertFrom-Json
          $rows = @(
            ("installer_sha256=" + (Get-FileHash $install.FullName -Algorithm SHA256).Hash.ToLowerInvariant()),
            ("node_sha256=" + $manifest.node_sha256),
            ("worker_sha256=" + $manifest.worker_sha256),
            ("lock_sha256=" + $manifest.lock_sha256),
            ("source_sha=" + "$env:GITHUB_SHA")
          )
          $rows | Set-Content "src-tauri/target/release/bundle/nsis/provenance-sha256.txt"
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/target/release/bundle/nsis/engine-inventory.json"
      - name: Check NSIS artifact and embedded engine
        shell: pwsh
        run: |
          $binary = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $binary) { throw "NSIS installer not created" }
          $node = "src-tauri/resources/engine/node.exe"
          $worker = "src-tauri/resources/engine/worker.cjs"
          if (-not (Test-Path $node) -or -not (Test-Path $worker)) { throw "Embedded runtime resources absent" }
          Get-FileHash $binary.FullName -Algorithm SHA256 | Format-List
          Get-FileHash $node -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-Windows-x64-UNSIGNED-NOT-A-RELEASE
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-Windows-x64-Provenance-SHA256
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/provenance-sha256.txt
            apps/desktop/src-tauri/target/release/bundle/nsis/engine-inventory.json
          if-no-files-found: error
          retention-days: 7
