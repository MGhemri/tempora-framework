name: TEMPORA Desktop Foundation

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "docs/reference/DESKTOP_ARCHITECTURE.md"
      - "docs/reference/ENGINE_BRIDGE.md"
      - ".github/workflows/desktop-foundation.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "docs/reference/DESKTOP_ARCHITECTURE.md"
      - ".github/workflows/desktop-foundation.yml"
      - "apps/desktop/electron/**"
  workflow_dispatch:
    inputs:
      synthetic_benchmark:
        description: 'Run an opt-in fictional corpus benchmark, without real research data'
        type: boolean
        required: false
        default: false
      synthetic_sizes:
        description: 'Synthetic event counts (100k excluded from CI)'
        type: choice
        required: false
        default: '100,1000'
        options:
          - '100,1000'
          - '100,1000,10000'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.synthetic_benchmark != true }}
    name: Desktop TypeScript and Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:bridge
      - run: node --test electron/tests/assistant-session.test.cjs
      - run: npm run test:transaction
      - run: npm run test:persistence-gate
      - run: npm run test:persistence-adapter
      - run: npm run test:persistence-coordinator
      - run: npm run test:recovery
      - run: npm run test:visualization
      - run: npm run test:windows-engine

  synthetic-benchmark:
    # Opt-in only, never a required PR status; no new workflow files.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.synthetic_benchmark == true }}
    name: Optional synthetic TVRW performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install research desktop test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Measure fictional scientific workload
        env:
          SYNTHETIC_SIZES: ${{ inputs.synthetic_sizes }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../work/benchmarks
          node scripts/bench-visualization.mjs --sizes="$SYNTHETIC_SIZES" --iterations=3 \
            > ../../work/benchmarks/tvrw-synthetic-report.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('../../work/benchmarks/tvrw-synthetic-report.json','utf8'));if(!p.synthetic||p.sizes.length<2)process.exit(1);console.log('Synthetic counts:',p.sizes.map(x=>x.size).join(', '))"
      - name: Store audit report, not a performance certification
        uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-TVRW-SYNTHETIC-PERFORMANCE-NOT-CERTIFIED
          path: work/benchmarks/tvrw-synthetic-report.json
          if-no-files-found: error
          retention-days: 14

  electron-windows-examples:
    name: TEMPORA Desktop Chromium Windows x64 NSIS and bundled examples
    runs-on: windows-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.synthetic_benchmark != true }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/desktop/electron/package-lock.json
      - name: Build shared Desktop GUI and contract tests
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:bridge
          npm run test:visualization
          node --test electron/tests/host.test.cjs
          node --test electron/tests/assistant-session.test.cjs
          node --test electron/tests/review-integrity.test.cjs
          npm run test:transaction
          npm run test:persistence-gate
          npm run test:persistence-adapter
          npm run test:persistence-coordinator
          npm run test:recovery
      - name: Stage pinned scientific runtime
        run: npm run stage:windows-engine
      - name: Test pinned Node worker and human staging before Electron packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP 'tempora-pinned-worker-smoke'
          New-Item -ItemType Directory -Force (Join-Path $sandbox 'engine') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $sandbox 'examples') | Out-Null
          Copy-Item -Recurse -Force './src-tauri/resources/engine/*' (Join-Path $sandbox 'engine')
          Copy-Item -Recurse -Force './examples/*' (Join-Path $sandbox 'examples')
          node electron/tests/packaged-engine-smoke.cjs $sandbox
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_WORKER_SMOKE_FAILED' }
      - name: Restore exact Electron packaging toolchain
        working-directory: apps/desktop/electron
        run: npm ci --no-audit --no-fund
      - name: Package unsigned experimental Electron NSIS
        working-directory: apps/desktop/electron
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $log = (npm run dist:win 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $log
            if ($code -eq 0) { break }
            if ($attempt -eq 3 -or $log -notmatch 'Response code 50[234]|Gateway Time-out|ETIMEDOUT|ECONNRESET') {
              throw ('ELECTRON_NSIS_BUILD_FAILED: attempt ' + $attempt + ', exit code ' + $code)
            }
            Write-Warning ('Transient packaging download failure; retry ' + ($attempt + 1) + '/3')
            Start-Sleep -Seconds (15 * $attempt)
          }
      - name: Test packaged resources and canonical sample with embedded engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resourceRoot = 'electron/release/win-unpacked/resources'
          foreach ($name in @('README.md','synthetic-canonical-v3.json','alnop-geographic-sample.geojson','alnop-canonical-v3-demo.json')) {
            if (-not (Test-Path (Join-Path $resourceRoot ('examples/' + $name)))) {
              throw ('ELECTRON_EXAMPLE_MISSING: ' + $name)
            }
          }
          foreach ($name in @('framework/assist-inspection.js','assist-io/xlsx-inventory.js','assist-io/xlsx-cells.js','framework/assist-mapping.js','framework/assist-preview.js','framework/assist-normalization.js','profiles/synthetic-history/profile.json')) {
            if (-not (Test-Path (Join-Path $resourceRoot ('assistant/' + $name)))) {
              throw ('ELECTRON_ASSISTANT_INSPECTOR_MISSING: ' + $name)
            }
          }
          node electron/tests/packaged-engine-smoke.cjs $resourceRoot
          if ($LASTEXITCODE -ne 0) { throw 'ELECTRON_EXAMPLE_SMOKE_FAILED' }
          $setups = @(Get-ChildItem electron/release -File -Filter '*SETUP.exe')
          if ($setups.Count -ne 1) { throw 'ELECTRON_NSIS_INSTALLER_MISSING_OR_AMBIGUOUS' }
          Write-Host ('Unsigned experimental Electron NSIS: ' + $setups[0].Name)
          ./electron/scripts/verify-installed-examples.ps1 -Installer $setups[0].FullName -InstallDirectory "$env:RUNNER_TEMP/tempora-electron-j8-examples"
