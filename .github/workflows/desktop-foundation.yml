name: TEMPORA Desktop Foundation

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "docs/reference/DESKTOP_ARCHITECTURE.md"
      - "docs/reference/ENGINE_BRIDGE.md"
      - ".github/workflows/desktop-foundation.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "docs/reference/DESKTOP_ARCHITECTURE.md"
      - ".github/workflows/desktop-foundation.yml"
      - "apps/desktop/electron/**"
  workflow_dispatch:
    inputs:
      synthetic_benchmark:
        description: 'Run an opt-in fictional corpus benchmark, without real research data'
        type: boolean
        required: false
        default: false
      synthetic_sizes:
        description: 'Synthetic event counts (100k excluded from CI)'
        type: choice
        required: false
        default: '100,1000'
        options:
          - '100,1000'
          - '100,1000,10000'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.synthetic_benchmark != true }}
    name: Desktop TypeScript and Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:bridge
      - run: npm run test:stable-release
      - run: node --test electron/tests/assistant-session.test.cjs
      - run: npm run test:transaction
      - run: npm run test:persistence-gate
      - run: npm run test:persistence-adapter
      - run: npm run test:persistence-coordinator
      - run: npm run test:native-persistence
      - run: npm run test:persistence-binding
      - run: npm run test:persistence-authority
      - run: npm run test:local-save-gate
      - run: npm run test:native-guard
      - run: npm run test:scientific-native-transport
      - run: npm run test:recovery
      - run: npm run test:visualization
      # Individual suites above already ran; retain host and integrity
      # contract coverage without running every Desktop suite twice.
      - run: node --test electron/tests/host.test.cjs electron/tests/review-integrity.test.cjs

  synthetic-benchmark:
    # Opt-in only, never a required PR status; no new workflow files.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.synthetic_benchmark == true }}
    name: Optional synthetic TVRW performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install research desktop test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Measure fictional scientific workload
        env:
          SYNTHETIC_SIZES: ${{ inputs.synthetic_sizes }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../work/benchmarks
          node scripts/bench-visualization.mjs --sizes="$SYNTHETIC_SIZES" --iterations=3 \
            > ../../work/benchmarks/tvrw-synthetic-report.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('../../work/benchmarks/tvrw-synthetic-report.json','utf8'));if(!p.synthetic||p.sizes.length<2)process.exit(1);console.log('Synthetic counts:',p.sizes.map(x=>x.size).join(', '))"
      - name: Store audit report, not a performance certification
        uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-TVRW-SYNTHETIC-PERFORMANCE-NOT-CERTIFIED
          path: work/benchmarks/tvrw-synthetic-report.json
          if-no-files-found: error
          retention-days: 14

  electron-windows-examples:
    name: TEMPORA Desktop Chromium Windows x64 NSIS and bundled examples
    runs-on: windows-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.synthetic_benchmark != true }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/desktop/electron/package-lock.json
      - name: Build and test Windows native handle guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --manifest-path native-windows-guard/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_GUARD_RUST_TEST_FAILED' }
          cargo build --release --manifest-path native-windows-guard/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_GUARD_WINDOWS_BUILD_FAILED' }
          node --test electron/tests/windows-native-destination.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_GUARD_INTEGRATION_FAILED' }
      - name: Build shared Desktop GUI and contract tests
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:bridge
          npm run test:stable-release
          npm run test:visualization
          node --test electron/tests/host.test.cjs
          node --test electron/tests/assistant-session.test.cjs
          node --test electron/tests/review-integrity.test.cjs
          npm run test:transaction
          npm run test:persistence-gate
          npm run test:persistence-adapter
          npm run test:persistence-coordinator
          npm run test:native-persistence
          npm run test:persistence-binding
          npm run test:persistence-authority
          npm run test:local-save-gate
          npm run test:recovery
          npm run test:scientific-native-transport
          node --test electron/tests/native-probe-inventory.test.cjs
      - name: Stage pinned scientific runtime
        run: npm run stage:windows-engine
      - name: Test pinned Node worker and human staging before Electron packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP 'tempora-pinned-worker-smoke'
          New-Item -ItemType Directory -Force (Join-Path $sandbox 'engine') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $sandbox 'examples') | Out-Null
          Copy-Item -Recurse -Force './src-tauri/resources/engine/*' (Join-Path $sandbox 'engine')
          Copy-Item -Recurse -Force './examples/*' (Join-Path $sandbox 'examples')
          node electron/tests/packaged-engine-smoke.cjs $sandbox
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_WORKER_SMOKE_FAILED' }
      - name: Restore exact Electron packaging toolchain
        working-directory: apps/desktop/electron
        run: npm ci --no-audit --no-fund
      - name: Package unsigned experimental Electron NSIS
        working-directory: apps/desktop/electron
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $log = (npm run dist:win 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $log
            if ($code -eq 0) { break }
            if ($attempt -eq 3 -or $log -notmatch 'Response code 50[234]|Gateway Time-out|ETIMEDOUT|ECONNRESET') {
              throw ('ELECTRON_NSIS_BUILD_FAILED: attempt ' + $attempt + ', exit code ' + $code)
            }
            Write-Warning ('Transient packaging download failure; retry ' + ($attempt + 1) + '/3')
            Start-Sleep -Seconds (15 * $attempt)
          }
      - name: Test packaged resources and canonical sample with embedded engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resourceRoot = 'electron/release/win-unpacked/resources'
          foreach ($name in @('README.md','synthetic-canonical-v3.json','alnop-geographic-sample.geojson','alnop-canonical-v3-demo.json')) {
            if (-not (Test-Path (Join-Path $resourceRoot ('examples/' + $name)))) {
              throw ('ELECTRON_EXAMPLE_MISSING: ' + $name)
            }
          }
          foreach ($name in @('framework/assist-inspection.js','assist-io/xlsx-inventory.js','assist-io/xlsx-cells.js','framework/assist-mapping.js','framework/assist-preview.js','framework/assist-normalization.js','profiles/synthetic-history/profile.json')) {
            if (-not (Test-Path (Join-Path $resourceRoot ('assistant/' + $name)))) {
              throw ('ELECTRON_ASSISTANT_INSPECTOR_MISSING: ' + $name)
            }
          }
          node electron/tests/packaged-engine-smoke.cjs $resourceRoot
          if ($LASTEXITCODE -ne 0) { throw 'ELECTRON_EXAMPLE_SMOKE_FAILED' }
          $setups = @(Get-ChildItem electron/release -File -Filter '*SETUP.exe')
          if ($setups.Count -ne 1) { throw 'ELECTRON_NSIS_INSTALLER_MISSING_OR_AMBIGUOUS' }
          Write-Host ('Unsigned experimental Electron NSIS: ' + $setups[0].Name)
          ./electron/scripts/verify-installed-examples.ps1 -Installer $setups[0].FullName -InstallDirectory "$env:RUNNER_TEMP/tempora-electron-j8-examples"
      - name: Build unsigned Microsoft Store AppX candidate (never publish)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location electron
          npm run dist:store
          if ($LASTEXITCODE -ne 0) { throw 'TEMPORA_STORE_APPX_BUILD_FAILED' }
          Pop-Location
          $packages = @(Get-ChildItem electron/release -File -Filter '*-STORE.appx')
          if ($packages.Count -ne 1) { throw 'TEMPORA_STORE_APPX_MISSING_OR_AMBIGUOUS' }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entry = $zip.GetEntry('AppxManifest.xml')
            if ($null -eq $entry) { throw 'TEMPORA_STORE_MANIFEST_MISSING' }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $identity = $manifest.Package.Identity
            if ($identity.Name -ne 'GhemriM.TEMPORADesktop') { throw 'TEMPORA_STORE_IDENTITY_MISMATCH' }
            if ($identity.Publisher -ne 'CN=C5BC3837-BBC8-425E-916B-4B6F77BD7455') { throw 'TEMPORA_STORE_PUBLISHER_MISMATCH' }
            $package = Get-Content electron/package.json -Raw | ConvertFrom-Json
          if ($package.version -cne '1.0.0') { throw 'TEMPORA_STABLE_VERSION_MISMATCH' }
          $expectedVersion = [Version]::Parse(($package.version + '.0'))
          if ([Version]::Parse([string]$identity.Version) -ne $expectedVersion) {
            throw 'TEMPORA_STORE_VERSION_MISMATCH'
          }
          if ([string]$manifest.Package.Applications.Application.Id -cne 'TEMPORADesktop') {
            throw 'TEMPORA_STORE_APPLICATION_ID_MISMATCH'
          }
            if ($identity.ProcessorArchitecture -ne 'x64') { throw 'TEMPORA_STORE_ARCH_MISMATCH' }
            Write-Host ('Validated candidate, not submitted: '+$packages[0].Name)
          } finally { $zip.Dispose() }
      - name: Record separate NSIS and AppX SHA-256 release evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem electron/release -File -Filter '*SETUP.exe')
          $appx = @(Get-ChildItem electron/release -File -Filter '*-STORE.appx')
          if ($setup.Count -ne 1 -or $appx.Count -ne 1) {
            throw 'TEMPORA_STABLE_ARTIFACTS_MISSING_OR_AMBIGUOUS'
          }
          $pkg = Get-Content electron/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -cne '1.0.0') { throw 'TEMPORA_STABLE_VERSION_MISMATCH' }
          $setupHash = (Get-FileHash -LiteralPath $setup[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $appxHash = (Get-FileHash -LiteralPath $appx[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$setupHash  $($setup[0].Name)"
            "$appxHash  $($appx[0].Name)"
          ) | Set-Content -LiteralPath 'electron/release/SHA256SUMS.txt' -Encoding ascii
          $evidence = [ordered]@{
            schema_version = 'tempora-desktop-release-candidate-v1'
            desktop_version = $pkg.version
            source_commit_sha = $env:GITHUB_SHA
            github_run_id = $env:GITHUB_RUN_ID
            scientific_engine = 'tempora-framework@3.0.0'
            desktop_runtime = 'Electron/Chromium'
            architecture = 'x64'
            store_package_identity = 'GhemriM.TEMPORADesktop'
            store_publisher = 'CN=C5BC3837-BBC8-425E-916B-4B6F77BD7455'
            store_application_id = 'TEMPORADesktop'
            nsis_name = $setup[0].Name
            nsis_sha256 = $setupHash
            appx_name = $appx[0].Name
            appx_sha256 = $appxHash
            signing_status = 'unsigned_ci_candidate'
            windows_clean_vm_acceptance = 'manual_not_verified'
            microsoft_store_submission = 'not_submitted_by_ci'
            packaged_scientific_persistence = 'disabled'
          }
          $evidence | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath 'electron/release/RELEASE-PROVENANCE.json' -Encoding utf8
          Write-Host ('Stable source candidate, not a signed/public release: '+ $pkg.version)
          Write-Host ('NSIS SHA-256: '+ $setupHash)
          Write-Host ('AppX SHA-256: '+ $appxHash)
      - name: Preserve unsigned NSIS 1.0.0 TEST candidate
        uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-1.0.0-x64-NSIS-UNSIGNED-TEST-CANDIDATE
          path: |
            apps/desktop/electron/release/*SETUP.exe
            apps/desktop/electron/release/SHA256SUMS.txt
            apps/desktop/electron/release/RELEASE-PROVENANCE.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Store candidate for MANUAL Partner Center submission
        uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-1.0.0-x64-STORE-CANDIDATE-UNSIGNED-NOT-SUBMITTED
          path: |
            apps/desktop/electron/release/*-STORE.appx
            apps/desktop/electron/release/SHA256SUMS.txt
            apps/desktop/electron/release/RELEASE-PROVENANCE.json
          if-no-files-found: error
          retention-days: 30
