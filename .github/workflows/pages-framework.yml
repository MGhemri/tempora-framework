name: Publish TEMPORA GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "schemas/**"
      - "profiles/**"
      - "distribution/**"
      - "scripts/build-framework-site.js"
      - "tests/framework-site.test.js"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CITATION.cff"
      - "LICENSE"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages-framework.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tempora-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:site
      - run: npm run build:site -- --output work/pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: work/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy TEMPORA
        id: deployment
        uses: actions/deploy-pages@v5
