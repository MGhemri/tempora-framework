name: TEMPORA Desktop WebView2-Free Electron Experiment

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-electron-fallback.yml"
  workflow_dispatch:

concurrency:
  group: electron-fallback-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  electron-windows:
    name: Bundle standalone Chromium Windows desktop
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/desktop/electron/package-lock.json
      - name: Install TEMPORA frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile shared TEMPORA frontend
        run: npm run build
      - name: Run native bridge and packaging contracts
        run: |
          npm run test:bridge
          npm run test:windows-engine
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --test electron/tests/host.test.cjs
          node --test electron/tests/review-integrity.test.cjs
      - name: Stage official Node and pinned TEMPORA Engine 3.0.0
        run: npm run stage:windows-engine
      - name: Install exact-pinned Electron packaging toolchain
        working-directory: apps/desktop/electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 'false'
        run: npm ci --no-audit --no-fund
      - name: Verify Electron dependency resolution is frozen
        shell: pwsh
        run: |
          git diff --exit-code -- electron/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw "ELECTRON_PACKAGE_LOCK_CHANGED" }
          $meta = Get-Content "electron/package-lock.json" -Raw | ConvertFrom-Json -AsHashtable
          if ($meta.lockfileVersion -ne 3) { throw "ELECTRON_LOCKFILE_VERSION_INVALID" }
      - name: Build unsigned Windows NSIS with bundled Chromium
        working-directory: apps/desktop/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Check package and TEMPORA scientific worker inventory
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem electron/release -Filter '*SETUP.exe' -Recurse -File)
          if ($nsis.Count -ne 1) { throw "ELECTRON_NSIS_NOT_UNIQUE: $($nsis.Count)" }
          $unpacked = Get-ChildItem electron/release -Directory -Filter '*unpacked' | Select-Object -First 1
          if (-not $unpacked) { throw "ELECTRON_UNPACKED_DIR_MISSING" }
          $node = Join-Path $unpacked.FullName 'resources/engine/node.exe'
          $worker = Join-Path $unpacked.FullName 'resources/engine/worker.cjs'
          $enginePkg = Join-Path $unpacked.FullName 'resources/engine/node_modules/tempora-framework/package.json'
          foreach ($item in @($node,$worker,$enginePkg)) {
            if (-not (Test-Path $item -PathType Leaf)) { throw "ELECTRON_ENGINE_BUNDLE_MISSING: $item" }
          }
          $sdk = Get-Content $enginePkg -Raw | ConvertFrom-Json
          if ($sdk.version -ne '3.0.0') { throw "ELECTRON_SDK_VERSION_MISMATCH" }
          Write-Host "Chromium bundled NSIS: $($nsis[0].Name)"
          Write-Host "NSIS SHA256: $((Get-FileHash $nsis[0].FullName -Algorithm SHA256).Hash)"
      - name: Execute canonical TEMPORA 3.0.0 in packaged Windows resources
        shell: pwsh
        run: |
          $root = Join-Path (Resolve-Path "electron/release/win-unpacked").Path "resources"
          node electron/tests/packaged-engine-smoke.cjs $root
          if ($LASTEXITCODE -ne 0) { throw "PACKAGED_SCIENTIFIC_ENGINE_SMOKE_FAILED" }
      - name: Capture experimental installer provenance
        shell: pwsh
        run: |
          $dir = "electron/release"
          $exe = @(Get-ChildItem $dir -Filter "*SETUP.exe" -File)
          if ($exe.Count -ne 1) { throw "ELECTRON_NSIS_PROVENANCE_MISSING" }
          @(
            "source_commit=$env:GITHUB_SHA",
            "electron=45.2.3",
            "sdk=tempora-framework@3.0.0",
            "electron_lock_sha256=$((Get-FileHash 'electron/package-lock.json' -Algorithm SHA256).Hash.ToLowerInvariant())",
            "nsis_sha256=$((Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          ) | Set-Content (Join-Path $dir "electron-provenance-sha256.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-Electron-Windows-EXPERIMENTAL-NOT-RELEASE
          path: |
            apps/desktop/electron/release/*SETUP.exe
            apps/desktop/electron/release/electron-provenance-sha256.txt
          if-no-files-found: error
          retention-days: 7
