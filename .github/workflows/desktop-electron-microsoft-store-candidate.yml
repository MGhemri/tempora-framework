name: TEMPORA Desktop — Microsoft Store Candidate (AppX, not submitted)

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-electron-microsoft-store-candidate.yml'
      - 'apps/desktop/electron/**'
      - 'apps/desktop/src/**'
      - 'apps/desktop/bridge/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tempora-store-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  store-candidate:
    name: Build verified Windows x64 AppX for Partner Center
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: apps/desktop
    env:
      TEMPORA_STORE_IDENTITY_NAME: 'GhemriM.TEMPORADesktop'
      TEMPORA_STORE_PUBLISHER: 'CN=C5BC3837-BBC8-425E-916B-4B6F77BD7455'
      TEMPORA_STORE_PUBLISHER_DISPLAY_NAME: 'Ghemri M'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Verify official Partner Center package identity
        shell: pwsh
        run: |
          $identity = @{
            TEMPORA_STORE_IDENTITY_NAME = 'GhemriM.TEMPORADesktop'
            TEMPORA_STORE_PUBLISHER = 'CN=C5BC3837-BBC8-425E-916B-4B6F77BD7455'
            TEMPORA_STORE_PUBLISHER_DISPLAY_NAME = 'Ghemri M'
          }
          foreach ($key in $identity.Keys) {
            if ([Environment]::GetEnvironmentVariable($key) -cne $identity[$key]) {
              throw "STORE_IDENTITY_MISMATCH: $key"
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/desktop/electron/package-lock.json
      - name: Compile frontend and test canonical bridge
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:bridge
          npm run test:windows-engine
          node --test electron/tests/host.test.cjs
          node --test electron/tests/review-integrity.test.cjs
      - name: Stage verified TEMPORA scientific engine
        run: npm run stage:windows-engine
      - name: Install exact Electron packaging dependencies
        working-directory: apps/desktop/electron
        run: npm ci --no-audit --no-fund
      - name: Create Windows Store tile assets using official icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $src = (Resolve-Path 'electron/build/icon-white-256.png').Path
          $dest = Join-Path (Resolve-Path 'electron/build').Path 'appx'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $original = [System.Drawing.Image]::FromFile($src)
          try {
            $sizes = @(
              @('StoreLogo.png',50,50),
              @('Square150x150Logo.png',150,150),
              @('Square44x44Logo.png',44,44),
              @('Wide310x150Logo.png',310,150)
            )
            foreach ($item in $sizes) {
              $width = [int]$item[1]
              $height = [int]$item[2]
              $img = [System.Drawing.Bitmap]::new($width,$height)
              $g = [System.Drawing.Graphics]::FromImage($img)
              try {
                $g.Clear([System.Drawing.Color]::White)
                $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $side = [Math]::Min($width,$height)
                $g.DrawImage($original,[System.Drawing.Rectangle]::new([int](($width-$side)/2),[int](($height-$side)/2),$side,$side))
                $img.Save((Join-Path $dest $item[0]),[System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $g.Dispose(); $img.Dispose() }
            }
          } finally { $original.Dispose() }
      - name: Package standalone Windows Store AppX (not signed locally)
        working-directory: apps/desktop/electron
        run: npx --no-install electron-builder --win appx --x64 --config ./store-appx.config.cjs
      - name: Verify actual AppX manifest, resources and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem electron/store-candidate -File -Filter '*.appx')
          if ($packages.Count -ne 1) { throw 'STORE_APPX_NOT_UNIQUE' }
          $appx = $packages[0]
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($appx.FullName)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\','/' })
            $manifestEntry = $archive.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' } | Select-Object -First 1
            if (-not $manifestEntry) { throw 'STORE_MANIFEST_MISSING' }
            $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try { $xml = [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($xml.Package.Identity.Name -cne $env:TEMPORA_STORE_IDENTITY_NAME -or
                $xml.Package.Identity.Publisher -cne $env:TEMPORA_STORE_PUBLISHER) {
              throw 'STORE_MANIFEST_PARTNER_CENTER_IDENTITY_MISMATCH'
            }
            if ($xml.Package.Properties.DisplayName -cne 'TEMPORA Desktop' -or
                $xml.Package.Properties.PublisherDisplayName -cne 'Ghemri M') {
              throw 'STORE_MANIFEST_DISPLAY_NAME_MISMATCH'
            }
            $sdk = @($names | Where-Object { $_.EndsWith('resources/engine/node_modules/tempora-framework/package.json') })
            $node = @($names | Where-Object { $_.EndsWith('resources/engine/node.exe') })
            $worker = @($names | Where-Object { $_.EndsWith('resources/engine/worker.cjs') })
            if ($sdk.Count -ne 1) { throw 'STORE_SCIENTIFIC_ENGINE_MISSING_IN_APPX' }
            if ($node.Count -ne 1 -or $worker.Count -ne 1) { throw 'STORE_SCIENTIFIC_WORKER_MISSING_IN_APPX' }
          } finally { $archive.Dispose() }
          $unpacked = 'electron/store-candidate/win-unpacked/resources'
          if (Test-Path (Join-Path $unpacked 'engine/node.exe')) {
            node electron/tests/packaged-engine-smoke.cjs $unpacked
            if ($LASTEXITCODE -ne 0) { throw 'STORE_PACKAGED_ENGINE_TEST_FAILED' }
          }
          $hash = (Get-FileHash $appx.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($appx.Name)" | Set-Content 'electron/store-candidate/SHA256SUMS.txt' -Encoding ascii
          Write-Host "Verified unsigned Store candidate: $($appx.Name)"
          Write-Host "SHA256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-Microsoft-Store-AppX-CANDIDATE-UNSIGNED-NOT-PUBLISHED
          path: |
            apps/desktop/electron/store-candidate/*.appx
            apps/desktop/electron/store-candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
