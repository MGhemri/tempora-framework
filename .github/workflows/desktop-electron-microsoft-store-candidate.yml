name: TEMPORA Desktop — Microsoft Store Candidate (AppX/MSIX family, unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tempora-store-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  store-candidate:
    name: Package Windows x64 candidate for Partner Center (NOT signed)
    runs-on: windows-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: apps/desktop
    env:
      TEMPORA_STORE_IDENTITY_NAME: ${{ vars.TEMPORA_STORE_IDENTITY_NAME }}
      TEMPORA_STORE_PUBLISHER: ${{ vars.TEMPORA_STORE_PUBLISHER }}
      TEMPORA_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.TEMPORA_STORE_PUBLISHER_DISPLAY_NAME }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Require actual Partner Center identity
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEMPORA_STORE_IDENTITY_NAME) -or
              [string]::IsNullOrWhiteSpace($env:TEMPORA_STORE_PUBLISHER) -or
              [string]::IsNullOrWhiteSpace($env:TEMPORA_STORE_PUBLISHER_DISPLAY_NAME)) {
            throw "MICROSOFT_STORE_PARTNER_CENTER_IDENTITY_REQUIRED: reserve TEMPORA Desktop in Partner Center and configure three repository variables"
          }
          Write-Host "Store identity configured (details redacted)"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/desktop/electron/package-lock.json
      - name: Compile shared desktop GUI and test scientific bridge
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:bridge
          npm run test:windows-engine
          node --test electron/tests/host.test.cjs
          node --test electron/tests/review-integrity.test.cjs
      - name: Stage offline pinned TEMPORA scientific engine
        run: npm run stage:windows-engine
      - name: Install locked Electron packaging toolchain
        working-directory: apps/desktop/electron
        run: npm ci --no-audit --no-fund
      - name: Create Store tile assets from official Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $source = (Resolve-Path 'electron/build/icon-white-256.png').Path
          $out = Join-Path (Resolve-Path 'electron/build').Path 'appx'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $image = [System.Drawing.Image]::FromFile($source)
          try {
            $sizes = @(
              @('StoreLogo.png',50,50),
              @('Square150x150Logo.png',150,150),
              @('Square44x44Logo.png',44,44),
              @('Wide310x150Logo.png',310,150)
            )
            foreach ($item in $sizes) {
              $w=[int]$item[1]; $h=[int]$item[2]
              $bmp=[System.Drawing.Bitmap]::new($w,$h)
              $gfx=[System.Drawing.Graphics]::FromImage($bmp)
              try {
                $gfx.Clear([System.Drawing.Color]::White)
                $gfx.InterpolationMode=[System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $side=[Math]::Min($w,$h)
                $gfx.DrawImage($image,[System.Drawing.Rectangle]::new([int](($w-$side)/2),[int](($h-$side)/2),$side,$side))
                $bmp.Save((Join-Path $out $item[0]),[System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $gfx.Dispose(); $bmp.Dispose() }
            }
          } finally { $image.Dispose() }
      - name: Package Store-compatible AppX (unsigned; Store will sign on certification)
        working-directory: apps/desktop/electron
        run: npx --no-install electron-builder --win appx --x64 --config ./store-appx.config.cjs
      - name: Verify candidate, manifest identity, scientific resources and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem electron/store-candidate -File -Filter '*.appx')
          if ($files.Count -ne 1) { throw "STORE_CANDIDATE_PACKAGE_NOT_UNIQUE" }
          $appx=$files[0]
          $sha=(Get-FileHash $appx.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $output=Join-Path (Resolve-Path 'electron/store-candidate').Path 'SHA256SUMS.txt'
          "$sha  $($appx.Name)" | Set-Content $output -Encoding ascii
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[System.IO.Compression.ZipFile]::OpenRead($appx.FullName)
          try {
            $manifest=$archive.Entries | Where-Object {$_.FullName -eq 'AppxManifest.xml'} | Select-Object -First 1
            if (-not $manifest) { throw 'STORE_MANIFEST_MISSING' }
            $reader=[System.IO.StreamReader]::new($manifest.Open())
            try { $xml=[xml]$reader.ReadToEnd() } finally { $reader.Dispose() }
            $identity=$xml.Package.Identity
            if ($identity.Name -ne $env:TEMPORA_STORE_IDENTITY_NAME -or
                $identity.Publisher -ne $env:TEMPORA_STORE_PUBLISHER) {
              throw 'STORE_MANIFEST_PARTNER_CENTER_IDENTITY_MISMATCH'
            }
            if ($xml.Package.Properties.DisplayName -ne 'TEMPORA Desktop') {
              throw 'STORE_DISPLAY_NAME_INCORRECT'
            }
          } finally { $archive.Dispose() }
          if (-not (Test-Path 'electron/store-candidate/win-unpacked/resources/engine/node_modules/tempora-framework/package.json')) {
            throw 'STORE_SCIENTIFIC_ENGINE_MISSING'
          }
          node electron/tests/packaged-engine-smoke.cjs 'electron/store-candidate/win-unpacked/resources'
          if ($LASTEXITCODE -ne 0) { throw 'STORE_PACKAGED_ENGINE_TEST_FAILED' }
          Write-Host "Unsigned Store candidate SHA256: $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: TEMPORA-Desktop-Microsoft-Store-AppX-CANDIDATE-UNSIGNED-NOT-PUBLISHED
          path: |
            apps/desktop/electron/store-candidate/*.appx
            apps/desktop/electron/store-candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
