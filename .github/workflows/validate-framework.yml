name: TEMPORA Framework
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framework:
    name: TEMPORA Framework on ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm test
        env:
          TEMPORA_AUDIT_RUNTIME: '1'
      - run: npm run check:publication-files
      - run: npm run test:standalone
