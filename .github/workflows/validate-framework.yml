name: TEMPORA Framework
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  framework:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    name: TEMPORA Framework / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm test
        env:
          TEMPORA_AUDIT_RUNTIME: '1'
      - run: npm run check:publication-files
      - run: npm run test:standalone

  branch-hygiene:
    # Reuses the existing Framework workflow; does not add a ninth workflow.
    # Dry-run on PRs; delete only merged, unprotected head branches on close.
    # An explicit setup marker cleans two previous maintenance PR branches once.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[branch-hygiene-setup]')) }}
    name: Git hygiene — safe merged branch audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify ownership, branch SHA and safe deletion eligibility
        uses: actions/github-script@v8
        with:
          script: |
            const {owner,repo}=context.repo;
            const own=owner+'/'+repo;
            if(own!=='MGhemri/tempora-framework'){
              core.warning('Repository mismatch; no deletion');return;
            }
            const pr=context.payload.pull_request;
            const closing= context.eventName==='pull_request' &&
              context.payload.action==='closed' && pr?.merged===true;
            const setup= context.eventName==='push' &&
              context.payload.head_commit?.message?.includes('[branch-hygiene-setup]');
            const dryRun=!closing&&!setup;
            let targets=[];
            if(context.eventName==='pull_request'){
              if(pr?.head?.repo?.full_name!==own){core.info('Fork head: preserve');return;}
              targets=[{name:pr.head.ref,expected:pr.head.sha,kind:'merged-head'}];
            }else if(setup){
              targets=[
                {name:'chore/tvrw-j7-safe-branch-cleanup',kind:'fully-integrated'},
                {name:'chore/tvrw-j7-finalize-benchmark-audit',kind:'fully-integrated'}
              ];
            }else return;
            const decisions=[];
            for(const target of targets){
              const name=target.name;
              if(name==='main'||name.startsWith('release/')||
                !/^(chore|feature|feat|fix|test|experiment)\//.test(name)){
                decisions.push({name,status:'preserve-protected-name'});continue;
              }
              let branch;
              try{branch=(await github.rest.repos.getBranch({owner,repo,branch:name})).data;}
              catch(error){
                if(error.status===404){decisions.push({name,status:'already-absent'});continue;}
                throw error;
              }
              if(branch.protected){
                decisions.push({name,status:'preserve-protected'});continue;
              }
              if(target.expected && branch.commit.sha!==target.expected){
                decisions.push({name,status:'preserve-updated-since-pr'});continue;
              }
              if(target.kind==='fully-integrated'){
                const cmp=(await github.rest.repos.compareCommitsWithBasehead({
                  owner,repo,basehead:'main...'+name
                })).data;
                if(cmp.ahead_by!==0){
                  decisions.push({name,status:'preserve-unique-commits'});continue;
                }
              }else if(!closing && !dryRun){
                decisions.push({name,status:'preserve-unmerged-pr'});continue;
              }
              if(dryRun){
                decisions.push({name,status:'dry-run-only'});continue;
              }
              const open=await github.paginate(github.rest.pulls.list,{
                owner,repo,state:'open',per_page:100
              });
              if(open.some(p=>p.base.ref===name||
                (p.head.repo?.full_name===own&&p.head.ref===name))){
                decisions.push({name,status:'preserve-open-pr'});continue;
              }
              const current=(await github.rest.repos.getBranch({
                owner,repo,branch:name
              })).data;
              if(current.protected||current.commit.sha!==branch.commit.sha){
                decisions.push({name,status:'preserve-changed-ref'});continue;
              }
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+name});
              decisions.push({name,status:'deleted',sha:branch.commit.sha});
            }
            core.info('TEMPORA branch hygiene: '+JSON.stringify({
              event:context.eventName,closing,setup,dryRun,decisions
            }));
