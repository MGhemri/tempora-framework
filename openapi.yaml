openapi: 3.0.3
info:
  title: ALN Historical Operations Dataset API
  version: 1.0.0
  description: >
    API REST publique donnant accès au corpus historique de 263 opérations
    militaires documentées de l'Armée de Libération Nationale (ALN) durant
    la Guerre de Libération algérienne (1954–1962).
  contact:
    name: Ghemri M.
    email: contact@connect-gm.com
    url: https://alnop.vercel.app/
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/

servers:
  - url: https://alnop.vercel.app/api/v1
    description: Serveur de production (Edge CDN Vercel)
  - url: http://localhost:3000/api/v1
    description: Environnement de développement local

paths:
  /operations:
    get:
      summary: Liste et filtrage des opérations historiques
      description: >
        Retourne la collection des opérations de l'ALN avec pagination,
        filtres thématiques, temporels et territoriaux, ou export GeoJSON direct.
      parameters:
        - name: id
          in: query
          description: Identifiant unique d'une opération (canonique ex OP_1954_001 ou alias ALN-1954-001)
          schema:
            type: string
        - name: wilaya
          in: query
          description: Code Wilaya (W1..W7, ZAA, ZAO, EMG) ou valeurs multiples séparées par virgules
          schema:
            type: string
        - name: year
          in: query
          description: Année (1954..1962) ou années multiples séparées par virgules
          schema:
            type: string
        - name: type
          in: query
          description: Type d'action militaire (embuscade, attaque, sabotage, accrochage, etc.)
          schema:
            type: string
        - name: q
          in: query
          description: Recherche plein texte (titre FR/AR, description, commandement, lieu, sources)
          schema:
            type: string
        - name: date_from
          in: query
          description: Date de début minimale (format YYYY, YYYY-MM ou YYYY-MM-DD)
          schema:
            type: string
        - name: date_to
          in: query
          description: Date de début maximale (format YYYY, YYYY-MM ou YYYY-MM-DD)
          schema:
            type: string
        - name: sort
          in: query
          description: Ordre chronologique avec bris d'égalité déterministe sur l'ID
          schema:
            type: string
            enum: [date_asc, date_desc]
            default: date_asc
        - name: format
          in: query
          description: Format de réponse (json ou geojson)
          schema:
            type: string
            enum: [json, geojson]
            default: json
        - name: limit
          in: query
          description: Nombre d'opérations par page (1 à 300)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 300
        - name: page
          in: query
          description: Numéro de la page (>= 1)
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        '200':
          description: Opérations récupérées avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsEnvelope'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSONFeatureCollection'
        '400':
          description: Paramètre de requête invalide ou plage chronologique inversée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Identifiant demandé inexistant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Méthode HTTP non autorisée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur serveur interne assainie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /operations/{id}:
    get:
      summary: Fiche détaillée d'une opération par identifiant
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de l'opération (ex OP_1954_001)
          schema:
            type: string
      responses:
        '200':
          description: Opération trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleOperationEnvelope'
        '400':
          description: Identifiant manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opération introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur serveur interne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stats:
    get:
      summary: Statistiques agrégées du corpus historique
      description: Ventilations globales ou filtrées par année, wilaya et type d'action.
      parameters:
        - name: wilaya
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Statistiques calculées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsEnvelope'
        '400':
          description: Paramètre invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur serveur interne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wilayas:
    get:
      summary: Référentiel des 10 Wilayas historiques et Zones Autonomes
      responses:
        '200':
          description: Liste des Wilayas historiques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WilayasEnvelope'
        '500':
          description: Erreur serveur interne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    EnvelopeMeta:
      type: object
      properties:
        api_version:
          type: string
          example: v1
        status:
          type: string
          example: success
        total:
          type: integer
          example: 263
        count:
          type: integer
          example: 50
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50
        total_pages:
          type: integer
          example: 6
        license:
          type: string
          example: https://creativecommons.org/licenses/by/4.0/
        attribution:
          type: string
          example: Ghemri M. (ALN Historical Operations Dataset)
        documentation:
          type: string
          example: https://alnop.vercel.app/api/docs
        timestamp:
          type: string
          format: date-time

    Operation:
      type: object
      properties:
        id:
          type: string
          example: OP_1954_001
        nom_operation:
          type: string
          example: Attaque de la caserne de Batna
        date_debut:
          type: string
          example: 1954-11-01
        date_fin:
          type: string
          example: 1954-11-01
        wilaya_concernee:
          type: string
          example: Wilaya I (Aurès)
        wilaya_code:
          type: string
          example: W1
        wilaya_label_fr:
          type: string
          example: Wilaya I (Aurès)
        wilaya_label_ar:
          type: string
          example: الولاية الأولى (الأوراس - النمامشة)
        wilaya_color:
          type: string
          example: '#c0392b'
        primary_affiliation:
          type: string
          example: W1
        territorial_affiliations:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: W1
              label_fr:
                type: string
              label_ar:
                type: string
              color:
                type: string
              role:
                type: string
                example: primary
              source_basis:
                type: string
        type_action:
          type: string
          example: Attaque de caserne
        localisation:
          type: object
          properties:
            region_ou_ville:
              type: string
              example: Batna
            coordonnees_approximatives:
              type: object
              properties:
                latitude:
                  type: number
                  example: 35.5559
                longitude:
                  type: number
                  example: 6.1741
        description:
          type: string
        commandement_aln:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: object

    OperationsEnvelope:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Operation'

    SingleOperationEnvelope:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
        data:
          $ref: '#/components/schemas/Operation'

    GeoJSONFeatureCollection:
      type: object
      properties:
        type:
          type: string
          example: FeatureCollection
        properties:
          type: object
          properties:
            generated_at:
              type: string
            total_features:
              type: integer
              example: 263
            pagination:
              type: object
              properties:
                paginated:
                  type: boolean
                  example: false
                note:
                  type: string
        features:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: Feature
              id:
                type: string
              geometry:
                type: object
              properties:
                type: object

    StatsEnvelope:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
        data:
          type: object
          properties:
            total_operations:
              type: integer
            by_year:
              type: object
            by_wilaya:
              type: object
            top_action_types:
              type: array
              items:
                type: object

    WilayasEnvelope:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
        data:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              label_fr:
                type: string
              label_ar:
                type: string
              color:
                type: string
              operations_count:
                type: integer

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Le paramètre 'limit' doit être un nombre entier positif compris entre 1 et 300.
